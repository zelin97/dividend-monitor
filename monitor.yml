name: 股息率监测

on:
  schedule:
    # GitHub Actions 使用 UTC 时间：07:35 UTC = 15:35 北京时间（工作日收盘后）
    # 想改成一天两次，可再加一行： - cron: '20 1 * * 1-5'  （= 北京 09:20 开盘后）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:   # 允许在 Actions 页面手动点「Run workflow」立即跑一次
    inputs:
      force:
        description: '忽略交易日限制，立即强制执行一次（周末/节假日测试时勾选）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write      # 需要把 state.json / 看板数据回写到仓库

concurrency:
  group: dividend-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行股息率检查
        env:
          TZ: Asia/Shanghai
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python monitor.py ${{ inputs.force && '--force' || '' }}

      - name: 回写状态与看板数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 这两个文件首次运行时才生成；非交易日脚本会提前退出，文件不存在时跳过即可
          for f in state.json docs/latest.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新股息率监测状态 [skip ci]"
            git push
          fi
